# task-flow model routing for this repository (overrides ~/.claude/task-flow/models.toml key by key).
# No secrets here. Codex runs through the CLI on its saved ChatGPT login (codex login).
# Codex plans, designs the backlog and implements; Claude Opus reviews independently.

[profiles.codex]
driver = "cli"
model = "gpt-6.1-sol"                # metadata only; the -m argument below picks the model
billing = "subscription"
command = ["codex", "exec", "--sandbox", "workspace-write", "--json", "--ephemeral", "-m", "gpt-6.1-sol", "-o", "{last_message_file}", "-"]
read_only_command = ["codex", "exec", "--sandbox", "read-only", "--json", "--ephemeral", "-m", "gpt-6.1-sol", "-o", "{last_message_file}", "-"]
prompt_via = "stdin"
usage_format = "codex-jsonl"
timeout_seconds = 1800

[roles]
planner = "codex"
backlog = "codex"
implementer = "codex"
reviewer = "claude:opus"
