default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
language = "system"
entry = "uv run --locked ruff check --fix"
types = ["python"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "uv run --locked ruff format"
types = ["python"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "pytest"
name = "pytest"
language = "system"
entry = "uv run --locked pytest -q"
stages = ["pre-push"]
pass_filenames = false
always_run = true
